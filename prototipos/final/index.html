<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c72a5">
<title>Ronda — Versión final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#1c72a5;--azul-7:#1a608a;--azul-8:#184e6f;--azul-1:#dae8f0;--azul-0:#edf4f8;
  --oro:#b0863a;--oro-7:#84662f;--oro-1:#f1e9db;--oro-0:#f9f5ef;
  --rojo:#cb3332;--rojo-0:#fbefef;--verde:#0e8a5f;--verde-0:#e8f6f0;
  --tinta:#13212d;--gris:#5a6a79;--tenue:#8a98a6;--linea:#e2e8ee;--fondo:#f2f5f8;--blanco:#fff;
  --r:16px;--sombra:0 1px 2px rgba(19,33,45,.05),0 4px 14px rgba(19,33,45,.05);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tinta);background:#dfe6ec;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.ico{width:22px;height:22px;flex:none}
#app{height:100dvh;display:flex;justify-content:center;align-items:center}
.marco{position:relative;width:100%;height:100dvh;background:var(--fondo);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:600px){.marco{width:402px;height:min(860px,calc(100dvh - 32px));border-radius:38px;box-shadow:0 30px 80px rgba(19,33,45,.28),0 0 0 10px #101820}}
.cuerpo{flex:1;overflow-y:auto;padding:18px 16px 104px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.cuerpo::-webkit-scrollbar{display:none}
.cuerpo.sin-tabs{padding-bottom:28px}
/* Barra inferior */
.tabs{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--linea);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:10.5px;font-weight:600;color:var(--tenue);border-radius:12px;position:relative}
.tab .pastilla{display:grid;place-items:center;width:52px;height:30px;border-radius:15px;transition:background .2s}
.tab.activa{color:var(--azul-7)}
.tab.activa .pastilla{background:var(--azul-1)}
.tab .globo{position:absolute;top:2px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--oro);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
/* Encabezados */
.titular{display:flex;align-items:center;justify-content:space-between;gap:12px}
.titular h1{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.titular p{color:var(--gris);font-size:13.5px;margin-top:2px}
.subbarra{display:flex;align-items:center;gap:8px;padding:12px 10px 4px}
.subbarra h1{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.redondo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--blanco);box-shadow:var(--sombra);color:var(--tinta);flex:none}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--azul);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;flex:none}
.avatar.oro{background:var(--oro-1);color:var(--oro-7)}
.avatar.gris{background:var(--azul-0);color:var(--azul-7)}
h2.sec{font-size:13px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
h2.sec a,h2.sec button{text-transform:none;letter-spacing:0;color:var(--azul-7);font-weight:600;font-size:13px}
/* Tarjetas */
.tarjeta{background:var(--blanco);border-radius:var(--r);box-shadow:var(--sombra);padding:16px}
.pila{display:flex;flex-direction:column;gap:12px}
.fila{display:flex;align-items:center;gap:12px}
.crece{flex:1;min-width:0}
.t1{font-weight:700;font-size:15px;line-height:1.3}
.t2{color:var(--gris);font-size:13px}
.t3{color:var(--tenue);font-size:12px}
.corta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lista{display:flex;flex-direction:column;gap:10px}
.item{background:var(--blanco);border-radius:var(--r);box-shadow:var(--sombra);padding:14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.item:active{transform:scale(.985)}
/* Puntos por clase */
.clase-pts{font-size:30px;font-weight:800;letter-spacing:-.03em;color:var(--azul-7);line-height:1;text-align:right}
.clase-pts small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--tenue);text-transform:uppercase;margin-top:3px}
.bolitas{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.bolita{width:11px;height:11px;border-radius:50%;border:2px solid #cfd8e0}
.bolita.si{background:var(--azul);border-color:var(--azul)}
.bolita.extra{background:var(--oro);border-color:var(--oro)}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--gris)}
.leyenda span{display:flex;align-items:center;gap:6px}
.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dato{background:var(--blanco);border-radius:14px;box-shadow:var(--sombra);padding:12px}
.dato b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.dato b i{font-style:normal;font-size:13px;color:var(--tenue);font-weight:600}
.dato span{font-size:11.5px;color:var(--gris);font-weight:500}
/* Avisos */
.aviso{border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center}
.aviso.azul{background:linear-gradient(135deg,#1c72a5,#184e6f);color:#fff;box-shadow:0 8px 22px rgba(28,114,165,.32)}
.aviso.azul .t2{color:rgba(255,255,255,.82)}
.aviso.verde{background:var(--verde-0);color:#0a5c40}
.aviso.oro{background:var(--oro-0);color:var(--oro-7);border:1px solid var(--oro-1)}
.aviso.neutro{background:var(--blanco);box-shadow:var(--sombra)}
.aviso.rojo{background:var(--rojo-0);color:#872726}
.pulso{width:10px;height:10px;border-radius:50%;background:#7ee2b8;box-shadow:0 0 0 0 rgba(126,226,184,.7);animation:pulso 1.8s infinite;flex:none}
@keyframes pulso{70%{box-shadow:0 0 0 10px rgba(126,226,184,0)}100%{box-shadow:0 0 0 0 rgba(126,226,184,0)}}
/* Botones y campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:13px;font-weight:700;font-size:15px;background:var(--azul);color:#fff;transition:transform .1s,background .15s}
.btn:active{transform:scale(.97)}
.btn:hover{background:var(--azul-7)}
.btn.ancho{width:100%}
.btn.sec{background:var(--blanco);color:var(--tinta);box-shadow:inset 0 0 0 1.5px var(--linea)}
.btn.sec:hover{background:#f7f9fb}
.btn.suave{background:var(--azul-0);color:var(--azul-7)}
.btn.claro{background:#fff;color:var(--azul-8)}
.btn.chico{height:36px;padding:0 13px;font-size:13px;border-radius:11px}
.btn.chico .ico{width:17px;height:17px}
.btn.gigante{height:68px;font-size:18px;border-radius:20px;box-shadow:0 10px 26px rgba(28,114,165,.35)}
.enlace{color:var(--azul-7);font-weight:600;font-size:14px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:13px;font-weight:600}
.campo input,.campo select,.campo textarea{height:48px;border-radius:13px;border:1.5px solid var(--linea);background:var(--blanco);padding:0 14px;font-size:16px;outline:none;width:100%}
.campo textarea{height:auto;padding:12px 14px;resize:none}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--azul);box-shadow:0 0 0 4px var(--azul-1)}
.campo small{color:var(--tenue);font-size:12px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.busca{position:relative}
.busca .ico{position:absolute;left:14px;top:13px;color:var(--tenue)}
.busca input{height:48px;width:100%;border-radius:14px;border:0;background:var(--blanco);box-shadow:var(--sombra);padding:0 14px 0 44px;font-size:16px;outline:none}
.busca input:focus{box-shadow:0 0 0 2px var(--azul)}
.error{color:var(--rojo);font-size:13.5px;font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--blanco);box-shadow:var(--sombra);font-weight:600;font-size:13.5px;color:var(--gris)}
.chip.activo{background:var(--tinta);color:#fff}
.segmento{display:flex;background:#e4eaf0;border-radius:13px;padding:4px}
.segmento button{flex:1;height:36px;border-radius:10px;font-weight:600;font-size:14px;color:var(--gris)}
.segmento button.activo{background:var(--blanco);color:var(--tinta);box-shadow:var(--sombra)}
.etq{display:inline-flex;align-items:center;gap:4px;height:23px;padding:0 9px;border-radius:12px;font-size:11.5px;font-weight:700;white-space:nowrap}
.etq .ico{width:13px;height:13px;stroke-width:2.6}
.etq.azul{background:var(--azul);color:#fff}.etq.celeste{background:var(--azul-0);color:var(--azul-7)}
.etq.verde{background:var(--verde-0);color:var(--verde)}.etq.gris{background:#eef1f4;color:var(--gris)}
.etq.oro{background:var(--oro-1);color:var(--oro-7)}.etq.rojo{background:var(--rojo-0);color:var(--rojo)}
.fechita{width:50px;height:54px;border-radius:13px;background:var(--azul-0);color:var(--azul-7);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.fechita b{font-size:20px;font-weight:800}.fechita span{font-size:11px;font-weight:700;text-transform:uppercase;margin-top:3px}
.fechita.viva{background:var(--azul);color:#fff}
.fechita.apagada{background:#eef1f4;color:var(--tenue)}
.marca{width:26px;height:26px;border-radius:9px;border:2px solid #cfd8e0;display:grid;place-items:center;flex:none;color:#fff}
.marca .ico{width:16px;height:16px;stroke-width:3}
.marca.si{background:var(--azul);border-color:var(--azul)}
.item.elegido{box-shadow:inset 0 0 0 2px var(--azul),var(--sombra);background:#f6fafc}
.interruptor{width:50px;height:30px;border-radius:15px;background:#cfd8e0;position:relative;flex:none;transition:background .2s}
.interruptor::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.interruptor.si{background:var(--azul)}.interruptor.si::after{left:23px}
.pasos{display:flex;align-items:center;gap:14px;justify-content:center}
.pasos b{font-size:34px;font-weight:800;min-width:48px;text-align:center}
.pasos button{width:46px;height:46px;border-radius:50%;background:var(--azul-0);color:var(--azul-7);display:grid;place-items:center}
.vacio{border:2px dashed #cfd8e0;border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--gris);font-size:14px}
/* Hojas */
.velo{position:absolute;inset:0;background:rgba(13,24,34,.45);display:flex;align-items:flex-end;z-index:20;animation:aparece .18s}
.hoja{width:100%;max-height:88%;overflow-y:auto;background:var(--fondo);border-radius:26px 26px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:sube .26s cubic-bezier(.2,.8,.2,1)}
.hoja::before{content:"";width:40px;height:5px;border-radius:3px;background:#cdd6de;align-self:center;flex:none}
.hoja h3{font-size:19px;font-weight:800;letter-spacing:-.01em}
@keyframes aparece{from{opacity:0}}@keyframes sube{from{transform:translateY(40px);opacity:.6}}
.toast{position:absolute;left:16px;right:16px;bottom:92px;background:var(--tinta);color:#fff;border-radius:14px;padding:13px 16px;font-size:14px;font-weight:500;z-index:30;display:flex;gap:10px;align-items:center;animation:sube .25s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast .ico{color:#7ee2b8}
.fab{position:absolute;right:16px;bottom:88px;height:54px;padding:0 20px 0 16px;border-radius:27px;background:var(--azul);color:#fff;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px rgba(28,114,165,.4);z-index:5}
/* Entrada */
.auth{flex:1;overflow-y:auto;padding:36px 20px 28px;display:flex;flex-direction:column;gap:18px}.auth>:first-child{margin-top:auto}.auth>:last-child{margin-bottom:auto}
.auth-marca{text-align:center}
.escudo{width:76px;height:76px;object-fit:contain}
.auth-marca h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:10px}
.auth-marca p{color:var(--gris);font-size:14px}
.demo{background:var(--oro-0);border:1px dashed #d9c49c;border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.demo>p{font-size:12px;font-weight:700;color:var(--oro-7);text-transform:uppercase;letter-spacing:.06em}
.demo button{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:9px 12px;text-align:left;font-size:13px}
.demo button b{display:block;font-size:14px}
.demo button span span{color:var(--gris)}.demo button b{color:var(--tinta)}
/* Marcaje */
.marcaje{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:28px 22px;text-align:center}
.sello{width:120px;height:120px;border-radius:50%;margin:0 auto;display:grid;place-items:center;animation:sello .5s cubic-bezier(.2,1.4,.4,1)}
.sello .ico{width:62px;height:62px;stroke-width:2.6}
.sello.bien{background:var(--verde);color:#fff;box-shadow:0 0 0 14px var(--verde-0)}
.sello.mal{background:var(--rojo);color:#fff;box-shadow:0 0 0 14px var(--rojo-0)}
@keyframes sello{from{transform:scale(.4);opacity:0}}
.nuevo{animation:nuevo 1.6s}
@keyframes nuevo{from{background:var(--verde-0);transform:translateY(-8px)}}
.contador{font-size:54px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--azul-7)}
.acciones4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acciones4 button,.acciones4 a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--gris);text-align:center;line-height:1.2}
.acciones4 .redondo{width:50px;height:50px;color:var(--azul-7)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu a,.menu button{background:var(--blanco);border-radius:var(--r);box-shadow:var(--sombra);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;font-weight:700}
.menu .ico{width:26px;height:26px;color:var(--azul)}
.menu span{font-weight:500;font-size:12.5px;color:var(--gris)}
.noti{background:#e9edf1;border-radius:18px;padding:12px;display:flex;gap:10px}
.noti .logo{width:38px;height:38px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none}
.noti .logo img{width:28px;height:28px}
.cinta{background:var(--oro-0);color:var(--oro-7);font-size:12.5px;font-weight:600;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--oro-1)}
/* Kiosco */
.kiosco{position:fixed;inset:0;background:#fff;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;padding:2.4vh;text-align:center}
.kiosco h1{font-size:clamp(26px,4.4vh,54px);font-weight:800;letter-spacing:-.02em}
.kiosco canvas{width:min(50vh,84vw);height:min(50vh,84vw);border-radius:18px;box-shadow:0 0 0 1px var(--linea)}
.kiosco .cuenta{font-size:clamp(44px,8vh,96px);font-weight:800;color:var(--azul-7);line-height:1}
.kiosco .riel{width:min(50vh,84vw);height:10px;border-radius:5px;background:var(--azul-1);overflow:hidden}
.kiosco .riel div{height:100%;background:var(--azul);transition:width .5s linear}
.kiosco .cerrar{position:absolute;top:18px;right:18px}
.cuerpo>*,.hoja>*,.auth>*,.marcaje>*{flex-shrink:0}
.btn{white-space:nowrap}

/* --- Version final: piezas tomadas de la propuesta B, en tema claro --- */
.tiempo{display:flex;flex-direction:column}
.hito{display:flex;gap:12px;position:relative;padding-bottom:16px;align-items:flex-start}
.hito:last-child{padding-bottom:0}
.hito::before{content:"";position:absolute;left:15px;top:34px;bottom:2px;width:2px;background:var(--linea)}
.hito:last-child::before{display:none}
.nodo{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:#eef1f4;color:var(--tenue)}
.nodo .ico{width:16px;height:16px;stroke-width:2.8}
.nodo.si{background:var(--verde-0);color:var(--verde)}
.marcaje.bien{background:radial-gradient(90% 60% at 50% 30%,#1b8f68,#0a3d2e 75%);color:#fff}
.marcaje.mal{background:radial-gradient(90% 60% at 50% 30%,#a53b39,#3d1312 75%);color:#fff}
.marcaje.bien .sello,.marcaje.mal .sello{width:128px;height:128px;background:#fff;box-shadow:none}
.marcaje.bien .sello .ico,.marcaje.mal .sello .ico{width:66px;height:66px;stroke-width:2.8}
.marcaje.bien .sello{color:#0e8a5f}.marcaje.mal .sello{color:#b3302e}
.btn.blanco,.btn.blanco:hover{background:#fff;color:#13212d}
.aro{width:92px;height:92px;border-radius:50%;border:5px solid var(--oro);display:grid;place-items:center;flex:none;background:#fff}
.aro b{font-size:42px;font-weight:800;color:var(--oro-7);line-height:1;letter-spacing:-.03em}
.renglones{padding:0;overflow:hidden}
.renglones>*{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--linea)}
.renglones>*:last-child{border-bottom:0}
.mas1{height:38px;padding:0 15px;border-radius:19px;background:var(--oro-1);box-shadow:inset 0 0 0 1.5px var(--oro);color:var(--oro-7);font-weight:800;font-size:14px;flex:none}
.mas1:active{transform:scale(.94)}
.mas1:disabled{background:#eef1f4;box-shadow:none;color:var(--tenue);cursor:default}
</style>
</head>
<body>
<div id="app"></div>
<script src="../comun.js?v=3"></script>
<script>
const R = Ronda, E = R.E, ico = R.ico, esc = R.esc;
const ESCUDO = '<img src="../escudo-umg.webp" alt="" class="escudo">';
const campo = (id, etq, extra = "", ayuda = "") => `<div class="campo"><label for="${id}">${etq}</label><input id="${id}" ${extra}>${ayuda ? `<small>${ayuda}</small>` : ""}</div>`;
const nombreCorto = (n) => (n || "").split(" ")[0];

// El punto extra se reparte de a uno, con un toque por clase (tomado de la propuesta B).
R.on("sumar-extra", (d) => {
  const yo = R.yo(); if (R.puntos(yo).saldo < 1) return;
  yo.extra.push({ claseId: d.id, puntos: 1, cuando: new Date() });
  R.toast(`+1 para ${R.clase(d.id).nombre}`);
});

/* ---------- Piezas ---------- */
function tabs(lista) {
  const r = R.ruta();
  return `<nav class="tabs">${lista.map(([href, icono, texto, globo]) => {
    const activa = href === "/admin" ? r === "/admin" : r.startsWith(href);
    return `<a class="tab ${activa ? "activa" : ""}" href="#${href}"><span class="pastilla">${ico(icono)}</span>${texto}${globo ? `<span class="globo">${globo}</span>` : ""}</a>`;
  }).join("")}</nav>`;
}
const tabsAlumno = () => tabs([["/inicio", "puntos", "Puntos"], ["/actividades", "calendario", "Actividades"], ["/extra", "regalo", "Extra", R.puntos(R.yo()).saldo || ""], ["/cursos", "libro", "Cursos"], ["/yo", "usuario", "Yo"]]);
const tabsAdmin = () => tabs([["/admin", "tablero", "Tablero"], ["/admin/actividades", "calendario", "Actividades"], ["/admin/alumnos", "usuarios", "Alumnos"], ["/admin/avisos", "campana", "Avisos"], ["/admin/mas", "mas", "Más"]]);
const sub = (titulo, atras, extra = "") => `<div class="subbarra"><a class="redondo" href="#${atras}" aria-label="Volver">${ico("izq")}</a><h1>${esc(titulo)}</h1>${extra}</div>`;
const hoja = (html) => `<div class="velo" data-accion="cerrar-hoja" data-solo="1"><div class="hoja">${html}</div></div>`;
function etqActividad(a, al) {
  const est = R.estadoAct(a);
  if (est === "borrador") return `<span class="etq gris">Borrador</span>`;
  if (al && al.asis[a.id]) return `<span class="etq verde">${ico("ok")}Asististe</span>`;
  if (est === "abierta") return `<span class="etq azul">Abierta ahora</span>`;
  if (est === "proxima") return `<span class="etq celeste">${R.relativo(a.inicia)}</span>`;
  return al ? `<span class="etq gris">No asististe</span>` : `<span class="etq gris">Cerrada</span>`;
}
const fechita = (a, cls = "") => `<div class="fechita ${cls}"><b>${a.inicia.getDate()}</b><span>${R.mes(a.inicia)}</span></div>`;
const ptsEtq = (a) => `<span class="etq oro">${a.tipo === "extra" ? "Extra · " : ""}${R.pl(a.puntos, "punto", "puntos")}</span>`;

/* ---------- Entrada ---------- */

/* ---------- Alumno ---------- */
function bannerActividad(yo) {
  const a = R.abierta(), p = R.proxima();
  if (a && yo.asis[a.id]) return `<div class="aviso verde">${ico("ok")}<div class="crece"><p class="t1">Ya marcaste ${esc(a.nombre)}</p><p class="t2" style="color:inherit;opacity:.8">Marcaste a las ${R.hora(yo.asis[a.id])} y tu punto ya está sumado</p></div></div>`;
  if (a) return `<div class="aviso azul" style="flex-direction:column;align-items:stretch">
      <div class="fila"><span class="pulso"></span><p style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Marcaje abierto ahora</p></div>
      <div><p class="t1" style="font-size:18px">${esc(a.nombre)}</p><p class="t2">${esc(a.lugar)} · cierra ${R.hora(a.cierra)} · ${R.pl(a.puntos, "punto", "puntos")}</p></div>
      <button class="btn claro" data-accion="hoja" data-hoja="como-marcar" data-id="${a.id}">${ico("qr")}Cómo marco mi asistencia</button>
    </div>`;
  if (p) return `<a class="aviso neutro" href="#/actividades">${fechita(p)}<div class="crece"><p class="t3" style="font-weight:700;text-transform:uppercase;letter-spacing:.05em">Próxima actividad · ${R.relativo(p.inicia)}</p><p class="t1">${esc(p.nombre)}</p><p class="t2">${R.fecha(p.inicia)} · ${esc(p.lugar)}</p></div>${ico("der")}</a>`;
  return "";
}
function bolitas(p, fila) {
  return `<div class="bolitas">${p.globales.map((a) => `<span class="bolita ${R.yo().asis[a.id] ? "si" : ""}"></span>`).join("")}${'<span class="bolita extra"></span>'.repeat(fila.extra)}</div>`;
}
function vInicio() {
  const yo = R.yo(), p = R.puntos(yo);
  const asisG = p.globales.filter((a) => yo.asis[a.id]).length;
  return `<main class="cuerpo" data-desliz="c">
    <div class="titular"><div><p style="color:var(--gris);font-weight:600">Hola, ${esc(nombreCorto(yo.nombre))}</p><h1>Tus puntos</h1></div><a class="avatar" href="#/yo">${R.iniciales(yo.nombre)}</a></div>
    ${bannerActividad(yo)}
    ${p.saldo > 0 ? `<a class="aviso oro" href="#/extra">${ico("regalo")}<div class="crece"><p class="t1">Tenés ${R.pl(p.saldo, "punto extra", "puntos extra")} sin repartir</p><p style="font-size:13px">Elegí a qué clase sumarlos antes del ${R.dia(E.corteExtra)}.</p></div>${ico("der")}</a>` : ""}
    <div class="resumen">
      <div class="dato"><b>${asisG}<i> de ${p.globales.length}</i></b><span>actividades asistidas</span></div>
      <div class="dato"><b>${yo.clases.length}</b><span>cursos inscritos</span></div>
      <div class="dato"><b style="color:var(--oro-7)">${p.saldo}</b><span>extra por repartir</span></div>
    </div>
    <h2 class="sec">Puntos por clase <a href="#/cursos">Editar cursos</a></h2>
    ${p.porClase.length === 0 ? `<div class="vacio"><p class="t1" style="color:var(--tinta)">Todavía no elegiste tus cursos</p><p>Tus asistencias ya están guardadas: los puntos aparecen solos cuando te inscribas.</p><a class="btn chico" style="margin-top:12px" href="#/cursos">Elegir mis cursos</a></div>` : `<div class="lista">${p.porClase.map((f) => `
      <button class="item" data-accion="hoja" data-hoja="clase" data-id="${f.clase.id}">
        <div class="crece"><p class="t1">${esc(f.clase.nombre)}</p><p class="t3">${f.clase.codigo} · ${esc(R.docente(f.clase.docenteId)?.nombre || "Sin catedrático asignado")}</p>${bolitas(p, f)}</div>
        <div class="clase-pts">${f.total}<small>${f.total === 1 ? "punto" : "puntos"}</small></div>
      </button>`).join("")}</div>
    <div class="leyenda"><span><i class="bolita si"></i>Asististe</span><span><i class="bolita"></i>No asististe</span><span><i class="bolita extra"></i>Punto extra</span></div>`}
  </main>${tabsAlumno()}`;
}
function hojaClase(id) {
  const yo = R.yo(), p = R.puntos(yo), f = p.porClase.find((x) => x.clase.id === id);
  if (!f) return "";
  return hoja(`<div class="fila"><div class="crece"><h3>${esc(f.clase.nombre)}</h3><p class="t2">${f.clase.codigo} · Sección ${f.clase.seccion} · ${esc(R.docente(f.clase.docenteId)?.nombre || "Sin catedrático asignado")}</p></div><div class="clase-pts" style="font-size:40px">${f.total}<small>${f.total === 1 ? "punto" : "puntos"}</small></div></div>
    <div class="tarjeta pila">${p.globales.map((a) => { const si = !!yo.asis[a.id]; return `<div class="fila"><span class="marca ${si ? "si" : ""}">${si ? ico("ok") : ""}</span><div class="crece"><p class="t1" style="font-size:14px">${esc(a.nombre)}</p><p class="t3">${R.dia(a.inicia)}${si ? ` · marcaste ${R.hora(yo.asis[a.id])}` : R.estadoAct(a) === "abierta" ? " · abierta ahora" : " · no asististe"}</p></div><b style="color:${si ? "var(--azul-7)" : "var(--tenue)"}">${si ? "+" + a.puntos : "0"}</b></div>`; }).join("")}
    ${f.extra ? `<div class="fila"><span class="marca si" style="background:var(--oro);border-color:var(--oro)">${ico("regalo")}</span><div class="crece"><p class="t1" style="font-size:14px">Puntos extra que repartiste acá</p></div><b style="color:var(--oro-7)">+${f.extra}</b></div>` : ""}</div>
    <p class="t3">Las actividades globales suman en todas tus clases a la vez. Los puntos extra van solo a la clase que elijas.</p>
    <button class="btn sec ancho" data-accion="cerrar-hoja">Cerrar</button>`);
}
function hojaComoMarcar(id) {
  const a = R.actividad(id);
  const paso = (n, t, d) => `<div class="fila" style="align-items:flex-start"><span class="avatar" style="width:32px;height:32px;font-size:14px">${n}</span><div><p class="t1">${t}</p><p class="t2">${d}</p></div></div>`;
  return hoja(`<h3>Cómo marcar tu asistencia</h3>
    <div class="tarjeta pila">${paso(1, "Abrí la cámara de tu teléfono", "La de siempre. No hace falta ninguna app aparte.")}${paso(2, "Apuntá al QR de la pantalla", "Está proyectado en el salón y cambia cada minuto.")}${paso(3, "Tocá el enlace y pulsá «Marcar asistencia»", "Listo: el punto se suma al instante.")}</div>
    <div class="demo"><p>Solo en este prototipo</p><button data-accion="escanear" data-id="${a.id}">${ico("qr")}<span><b>Simular que escaneé el QR</b><span>Abre la pantalla a la que llega el enlace real</span></span></button></div>`);
}
function vActividades() {
  const yo = R.yo(), todas = R.visibles();
  const ahora = todas.filter((a) => R.estadoAct(a) === "abierta"), prox = todas.filter((a) => R.estadoAct(a) === "proxima"), pas = todas.filter((a) => R.estadoAct(a) === "pasada").reverse();
  const sec = (t, d) => `<h2 class="sec">${t}<span style="text-transform:none;letter-spacing:0;font-weight:600;color:var(--tenue)">${d}</span></h2>`;
  const tarjeta = (a) => { const est = R.estadoAct(a); return `<div class="item" style="align-items:flex-start">${fechita(a, est === "abierta" ? "viva" : "")}
      <div class="crece pila" style="gap:6px"><div><p class="t1">${esc(a.nombre)}</p><p class="t2">${R.hora(a.inicia)} · ${esc(a.lugar)}</p></div>
      <div class="fila" style="gap:6px;flex-wrap:wrap">${etqActividad(a, yo)}${ptsEtq(a)}</div>
      ${est === "abierta" && !yo.asis[a.id] ? `<button class="btn chico suave" data-accion="hoja" data-hoja="como-marcar" data-id="${a.id}">${ico("qr")}Cómo marco</button>` : ""}</div></div>`; };
  // Las pasadas van compactas, como linea de tiempo: son consulta, no accion.
  const hito = (a) => { const si = !!yo.asis[a.id]; return `<div class="hito"><span class="nodo ${si ? "si" : ""}">${ico(si ? "ok" : "x")}</span>
      <div class="crece"><p class="t1" style="font-size:14.5px">${esc(a.nombre)}</p><p class="t3">${R.dia(a.inicia)}${si ? ` · marcaste ${R.hora(yo.asis[a.id])}` : " · no asististe"}</p></div>
      ${a.tipo === "extra" ? `<span class="etq oro">Extra</span>` : ""}<b style="color:${si ? "var(--azul-7)" : "var(--tenue)"}">${si ? "+" + a.puntos : "0"}</b></div>`; };
  return `<main class="cuerpo" data-desliz="c">
    <div class="titular"><div><h1>Actividades</h1><p>Cada asistencia suma en todas tus clases.</p></div></div>
    ${ahora.length ? sec("Ahora", "") + `<div class="lista">${ahora.map(tarjeta).join("")}</div>` : ""}
    ${prox.length ? sec("Próximas", prox.length) + `<div class="lista">${prox.map(tarjeta).join("")}</div>` : ""}
    ${pas.length ? sec("Ya pasaron", `asististe a ${pas.filter((a) => yo.asis[a.id]).length} de ${pas.length}`) + `<div class="tarjeta tiempo">${pas.map(hito).join("")}</div>` : ""}
    ${todas.length ? "" : `<div class="vacio">Todavía no hay actividades.</div>`}
  </main>${tabsAlumno()}`;
}
function vExtra() {
  const yo = R.yo(), p = R.puntos(yo);
  return `<main class="cuerpo" data-desliz="c">
    <div class="titular"><div><h1>Puntos extra</h1><p>Los ganás en actividades especiales y vos decidís a qué clase van.</p></div></div>
    <div class="tarjeta fila" style="gap:18px;background:var(--oro-0);box-shadow:inset 0 0 0 1px var(--oro-1)">
      <div class="aro"><b>${p.saldo}</b></div>
      <div><p style="font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--oro-7)">Saldo por repartir</p>
        <p class="t1" style="margin-top:4px">${p.saldo > 0 ? "Tocá +1 en la clase que quieras." : p.ganadoExtra ? "Ya repartiste todo tu saldo." : "Todavía no ganaste puntos extra."}</p>
        <p class="t2" style="margin-top:2px">${p.saldo > 0 ? `Se pierden si no los repartís antes del ${R.dia(E.corteExtra)}.` : `Ganados en total: ${p.ganadoExtra}`}</p></div></div>
    ${yo.clases.length ? `<h2 class="sec">Tus clases</h2><div class="tarjeta renglones">${p.porClase.map((f) => `<div><div class="crece"><p class="t1" style="font-size:14.5px">${esc(f.clase.nombre)}</p><p class="t3">Lleva ${R.pl(f.total, "punto", "puntos")}${f.extra ? ` · ${f.extra} extra` : ""}</p></div><button class="mas1" data-accion="sumar-extra" data-id="${f.clase.id}" ${p.saldo < 1 ? "disabled" : ""} aria-label="Sumar un punto extra a ${esc(f.clase.nombre)}">+1</button></div>`).join("")}</div>` : ""}
    ${yo.extra.length ? `<h2 class="sec">Ya repartido</h2><div class="tarjeta renglones">${yo.extra.map((x, i) => `<div><span class="avatar oro">+${x.puntos}</span><div class="crece"><p class="t1" style="font-size:14.5px">${esc(R.clase(x.claseId).nombre)}</p><p class="t3">${R.fecha(x.cuando)}</p></div><button class="enlace" data-accion="deshacer" data-i="${i}">Deshacer</button></div>`).join("")}</div><p class="t3">Podés deshacer un reparto hasta la fecha de corte.</p>` : ""}
  </main>${tabsAlumno()}`;
}
function vCursos() {
  const yo = R.yo(); const ciclo = E.ui.ciclo ?? (yo.ciclo || "todos"); const q = (E.ui.qCursos || "").toLowerCase();
  const ciclos = [...new Set(E.clases.map((c) => c.ciclo))];
  const lista = E.clases.filter((c) => (q ? (c.nombre + c.codigo).toLowerCase().includes(q) : ciclo === "mios" ? yo.clases.includes(c.id) : ciclo === "todos" || c.ciclo === ciclo));
  const chip = (v, t) => `<button class="chip ${ciclo === v ? "activo" : ""}" data-accion="ui" data-k="ciclo" data-v="${v}">${t}</button>`;
  return `<main class="cuerpo" data-desliz="c">
    <div class="titular"><div><h1>Mis cursos</h1><p>Marcá los que llevás este ciclo. Se guarda solo.</p></div><div class="clase-pts">${yo.clases.length}<small>elegidos</small></div></div>
    <div class="busca">${ico("buscar")}<input id="q-cursos" data-m="qCursos" data-vivo value="${esc(E.ui.qCursos || "")}" placeholder="Buscar por nombre o código" type="search"></div>
    <div class="chips">${chip("mios", "Solo los míos")}${yo.ciclo ? chip(yo.ciclo, `Mi ciclo (${yo.ciclo})`) : ""}${chip("todos", "Todos")}${ciclos.filter((c) => c !== yo.ciclo).map((c) => chip(c, "Ciclo " + c)).join("")}</div>
    <div class="lista">${lista.map((c) => { const si = yo.clases.includes(c.id); return `<button class="item ${si ? "elegido" : ""}" data-accion="curso" data-id="${c.id}"><span class="marca ${si ? "si" : ""}">${si ? ico("ok") : ""}</span><div class="crece"><p class="t1" style="font-size:14.5px">${esc(c.nombre)}</p><p class="t3">${c.codigo} · Ciclo ${c.ciclo} · Sección ${c.seccion} · ${c.jornada}</p>${c.docenteId ? `<p class="t2">${esc(R.docente(c.docenteId).nombre)}</p>` : ""}</div></button>`; }).join("") || `<div class="vacio">No encontramos cursos con ese criterio.</div>`}</div>
  </main>${tabsAlumno()}`;
}
function vYo() {

    <div class="titular"><h1>Mi cuenta</h1></div>
    <div class="tarjeta fila"><span class="avatar" style="width:56px;height:56px;font-size:19px">${R.iniciales(yo.nombre)}</span><div class="crece"><p class="t1" style="font-size:17px">${esc(yo.nombre)}</p><p class="t2">Carné ${yo.carne} · Ciclo ${yo.ciclo}</p><p class="t3 corta">${yo.email}</p></div></div>
    <div class="tarjeta pila">
      <button class="fila" data-accion="avisos" style="text-align:left">${ico("campana")}<div class="crece"><p class="t1">Avisarme de las actividades</p><p class="t2">Una notificación cuando haya una actividad nueva o estés por perder puntos extra. Nada más.</p></div><span class="interruptor ${E.avisos ? "si" : ""}"></span></button>
    </div>
    <div class="lista">
      <button class="item" data-accion="hoja" data-hoja="ios">${ico("celular")}<div class="crece"><p class="t1">Instalar la app en mi teléfono</p><p class="t2">Queda en tu pantalla de inicio, como cualquier otra.</p></div>${ico("der")}</button>
      ${yo.rol === "admin" ? `<button class="item" data-accion="vista-alumno" data-v="0">${ico("cambio")}<div class="crece"><p class="t1">Volver a Administración</p><p class="t2">Estás viendo tus propios puntos.</p></div>${ico("der")}</button>` : ""}

  return hoja(`<h3>Instalar en tu iPhone</h3><div class="tarjeta pila">${paso(1, "Abrí esta página en Safari", "Tiene que ser Safari: es el único que puede agregarla.")}${paso(2, "Tocá el botón Compartir", "El cuadrado con la flecha hacia arriba.")}${paso(3, "Elegí «Agregar a inicio»", "Puede que tengas que deslizar la lista hacia abajo.")}${paso(4, "Confirmá tocando «Agregar»", "El ícono aparece en tu pantalla de inicio.")}</div><p class="t3">En Android, Chrome te ofrece instalarla solo. Marcar asistencia siempre necesita internet.</p><button class="btn sec ancho" data-accion="cerrar-hoja">Entendido</button>`);
}
function vMarcar(id) {
  const yo = R.yo(), a = R.actividad(id);
  if (!a) return `<div class="marcaje">${ESCUDO.replace('class="escudo"', 'class="escudo" style="margin:0 auto"')}<h1 class="t1" style="font-size:22px">Actividad no encontrada</h1><p class="t2">Ese código no corresponde a ninguna actividad. Volvé a escanear el QR de la pantalla.</p><a class="btn sec" href="#/inicio">Ir al inicio</a></div>`;
  if (E.resultado) {
    const t = R.textoResultado(E.resultado, a, yo);
    return `<div class="marcaje ${t.bien ? "bien" : "mal"}"><div class="sello">${ico(t.bien ? "ok" : "x")}</div>
      <div><h1 style="font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2">${t.titulo}</h1><p style="margin-top:10px;font-size:15px;opacity:.88">${t.detalle}</p></div>
      ${t.bien ? `<p style="font-size:64px;font-weight:800;line-height:1;letter-spacing:-.04em">+${a.puntos}<span style="display:block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin-top:8px">${a.tipo === "extra" ? "a tu saldo extra" : `en tus ${yo.clases.length} clases`}</span></p><a class="btn blanco ancho" href="#/inicio">Ver mis puntos</a>`
      : `<button class="btn blanco ancho" data-accion="reintentar">${ico("qr")}Escanear otra vez</button><a href="#/inicio" style="font-weight:600;opacity:.88">Ir al inicio</a>`}</div>`;
  }
  return `<div class="marcaje">
    <div>${ESCUDO}<p class="t3" style="margin-top:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">Vas a marcar asistencia en</p><h1 style="font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-top:4px">${esc(a.nombre)}</h1><p class="t2" style="margin-top:6px">${esc(a.lugar)} · ${R.pl(a.puntos, "punto", "puntos")}</p></div>
    <div class="tarjeta fila" style="text-align:left"><span class="avatar">${R.iniciales(yo.nombre)}</span><div class="crece"><p class="t1">${esc(yo.nombre)}</p><p class="t3">Carné ${yo.carne}</p></div></div>
    <button class="btn gigante ancho" data-accion="marcar" data-id="${a.id}">Marcar asistencia</button>
    <div class="demo" style="text-align:left"><p>Solo en este prototipo</p><button data-accion="alternar" data-k="simVencido"><span class="interruptor ${E.ui.simVencido ? "si" : ""}"></span><span><b>Simular código vencido</b><span>Para ver la pantalla de error</span></span></button></div>
    <a class="enlace" href="#/inicio">Cancelar</a></div>`;
}

/* ---------- Administracion ---------- */
function vTablero() {
  const yo = R.yo(), a = R.abierta();

  const senales = E.bitacora.filter((x) => x.senal).length;
  const alerta = (icono, texto, href, etq) => `<a class="aviso oro" href="#${href}">${ico(icono)}<p class="crece" style="font-size:13.5px">${texto}</p><span class="enlace" style="color:inherit;white-space:nowrap">${etq}</span></a>`;
  return `<main class="cuerpo" data-desliz="c">
    <div class="titular"><div><p style="color:var(--gris);font-weight:600">Hola, ${esc(nombreCorto(yo.nombre))}</p><h1>Tablero</h1></div><a class="avatar oro" href="#/admin/mas">${R.iniciales(yo.nombre)}</a></div>
    ${a ? `<div class="aviso azul" style="flex-direction:column;align-items:stretch">
      <div class="fila"><span class="pulso"></span><p style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Marcaje abierto ahora</p></div>
      <div class="fila"><div class="crece"><p class="t1" style="font-size:18px">${esc(a.nombre)}</p><p class="t2">${esc(a.lugar)} · cierra ${R.hora(a.cierra)}</p></div><div style="text-align:right;line-height:1"><b style="font-size:36px;font-weight:800">${R.asistentes(a.id).length}</b><p style="font-size:11px;opacity:.8">asistencias</p></div></div>
      <div class="dos"><a class="btn claro" href="#/admin/vivo/${a.id}">${ico("vivo")}Ver en vivo</a><button class="btn claro" data-accion="kiosco" data-id="${a.id}">${ico("pantalla")}Kiosco</button></div></div>`
    : `<div class="aviso neutro">${ico("reloj")}<div class="crece"><p class="t1">No hay marcaje abierto</p><p class="t2">Cuando una actividad publicada entre en horario aparece acá.</p></div></div>`}
    <div class="resumen" style="grid-template-columns:1fr 1fr">
      <div class="dato"><b>${asisHoy}</b><span>asistencias hoy</span></div>
      <div class="dato"><b>${E.alumnos.length}</b><span>alumnos registrados</span></div>
      <div class="dato"><b>${E.actividades.filter((x) => x.estado === "publicada").length}</b><span>actividades publicadas</span></div>
      <div class="dato"><b style="color:var(--oro-7)">${sinDoc}</b><span>clases sin catedrático</span></div>
    </div>
    <h2 class="sec">Para revisar</h2>
    <div class="lista">
      ${sinDoc ? alerta("birrete", `<b>${sinDoc} clases</b> no tienen catedrático y no se pueden exportar.`, "/admin/clases", "Asignar") : ""}
      ${conSaldo ? alerta("regalo", `<b>${R.pl(conSaldo, "alumno tiene", "alumnos tienen")}</b> puntos extra sin repartir. Corte el ${R.dia(E.corteExtra)}.`, "/admin/avisos", "Avisar") : ""}
      ${senales ? alerta("alerta", `<b>${senales} entradas</b> de la bitácora conviene mirarlas.`, "/admin/bitacora", "Ver") : ""}
    </div>
    <div class="tarjeta pila"><div class="fila">${ico("bajar")}<div class="crece"><p class="t1">Reporte global</p><p class="t2">Todas las clases con catedrático, en un solo Excel.</p></div></div><button class="btn sec" data-accion="demo-toast" data-t="Prototipo: acá se descarga el Excel global.">Descargar reporte global</button></div>
  </main>${tabsAdmin()}`;
}
function vAdminActividades() {

  const chip = (v, t) => `<button class="chip ${f === v ? "activo" : ""}" data-accion="ui" data-k="fAct" data-v="${v}">${t}</button>`;
  return `<main class="cuerpo" data-desliz="c">
    <div class="titular"><div><h1>Actividades</h1><p>${E.actividades.length} en total · ${E.actividades.filter((a) => a.estado === "publicada").length} publicadas</p></div></div>
    <div class="chips">${chip("todas", "Todas")}${chip("publicada", "Publicadas")}${chip("borrador", "Borradores")}${chip("cerrada", "Cerradas")}</div>
    <div class="lista">${lista.map((a) => { const est = R.estadoAct(a); return `<a class="item" href="#/admin/vivo/${a.id}">${fechita(a, est === "abierta" ? "viva" : est === "pasada" || est === "borrador" ? "apagada" : "")}
      <div class="crece pila" style="gap:6px"><div><p class="t1">${esc(a.nombre)}</p><p class="t2">${R.hora(a.inicia)} · ${esc(a.lugar || "Sin lugar")}</p></div><div class="fila" style="gap:6px;flex-wrap:wrap">${etqActividad(a)}${ptsEtq(a)}</div></div>
      <div style="text-align:right;line-height:1.1"><b style="font-size:20px;font-weight:800">${R.asistentes(a.id).length}</b><p class="t3">asist.</p></div></a>`; }).join("")}</div>
  </main><button class="fab" data-accion="hoja" data-hoja="actividad">${ico("sumar")}Nueva</button>${tabsAdmin()}`;
}
function hojaActividad(id) {
  const a = id ? R.actividad(id) : null;

  const op = (v, t, sel) => `<option value="${v}" ${sel === v ? "selected" : ""}>${t}</option>`;
  return hoja(`<h3>${a ? "Editar actividad" : "Nueva actividad"}</h3>
    <form class="pila" data-envio="guardar-actividad" ${a ? `data-id="${a.id}"` : ""}>

      ${campo("f-lugar", "Lugar", `value="${esc(a?.lugar || "")}" placeholder="Salón 201"`)}${campo("f-inicia", "Empieza", `type="datetime-local" value="${a ? local(a.inicia) : ""}"`, "Hora de Guatemala.")}
      <div class="dos"><div class="campo"><label for="f-tipo">Tipo</label><select id="f-tipo">${op("global", "Global", a?.tipo)}${op("extra", "Extra", a?.tipo)}</select></div>${campo("f-puntos", "Puntos", `type="number" min="1" value="${a?.puntos || 1}"`)}</div>
      <div class="dos"><div class="campo"><label for="f-estado">Estado</label><select id="f-estado">${op("borrador", "Borrador", a?.estado)}${op("publicada", "Publicada", a?.estado)}${op("cerrada", "Cerrada", a?.estado)}</select></div>${campo("f-radio", "Zona (metros)", `type="number" value="${a?.radioM || ""}" placeholder="Opcional"`)}</div>
      <div class="campo"><label for="f-desc">Descripción</label><textarea id="f-desc" rows="2">${esc(a?.descripcion || "")}</textarea></div>
      <p class="t3">Las globales acreditan el punto en todas las clases del alumno. La extra le da saldo que él reparte. El marcaje abre 30 min antes y cierra al terminar.</p>
      ${E.ui.errorAct ? `<p class="error">${E.ui.errorAct}</p>` : ""}
      <button class="btn ancho">${a ? "Guardar cambios" : "Crear actividad"}</button>
    </form>`);
}
function vVivo(id) {

}
function hojaDocente() {
  return hoja(`<h3>Nuevo catedrático</h3><p class="t2">No tiene cuenta: es solo el nombre que agrupa sus clases en el Excel.</p><form class="pila" data-envio="nuevo-docente">${campo("nd-nombre", "Nombre", 'placeholder="Ing. Nombre Apellido"')}<button class="btn ancho">Crear</button></form>`);
}
function vClases() {
  const f = E.ui.fCl || "todas"; const q = (E.ui.qCl || "").toLowerCase();
  const sin = E.clases.filter((c) => !c.docenteId).length;
  const lista = E.clases.filter((c) => (f === "todas" || (f === "sin" ? !c.docenteId : c.ciclo === f)) && (!q || (c.nombre + c.codigo).toLowerCase().includes(q)));
  const chip = (v, t) => `<button class="chip ${f === v ? "activo" : ""}" data-accion="ui" data-k="fCl" data-v="${v}">${t}</button>`;
  return sub("Clases", "/admin/mas") + `<main class="cuerpo sin-tabs" data-desliz="c" style="padding-top:8px">
    ${sin ? `<div class="aviso oro">${ico("alerta")}<p style="font-size:13.5px"><b>${sin} de ${E.clases.length}</b> clases no tienen catedrático. Esas no se pueden exportar.</p></div>` : ""}
    <div class="busca">${ico("buscar")}<input id="q-cl" data-m="qCl" data-vivo value="${esc(E.ui.qCl || "")}" placeholder="Buscar por nombre o código" type="search"></div>
    <div class="chips">${chip("todas", "Todas")}${chip("sin", `Sin catedrático (${sin})`)}${[...new Set(E.clases.map((c) => c.ciclo))].map((c) => chip(c, "Ciclo " + c)).join("")}</div>
    <div class="lista">${lista.map((c) => `<div class="tarjeta pila" style="gap:8px"><div class="fila"><div class="crece"><p class="t1">${esc(c.nombre)}</p><p class="t3">${c.codigo} · Ciclo ${c.ciclo} · Sección ${c.seccion} · ${c.jornada}</p></div>${c.docenteId ? "" : '<span class="etq oro">Sin catedrático</span>'}</div>
      <div class="campo"><select data-cambio="docente" data-id="${c.id}" aria-label="Catedrático"><option value="">Sin catedrático</option>${E.docentes.map((d) => `<option value="${d.id}" ${c.docenteId === d.id ? "selected" : ""}>${esc(d.nombre)}</option>`).join("")}</select></div></div>`).join("")}</div></main>`;
}
function vBitacora() {
  const f = E.ui.fBit || "todo";
  const lista = E.bitacora.filter((x) => f === "todo" || (f === "senales" ? x.senal : x.resultado && x.resultado !== "ok"));
  const chip = (v, t) => `<button class="chip ${f === v ? "activo" : ""}" data-accion="ui" data-k="fBit" data-v="${v}">${t}</button>`;
  return sub("Bitácora", "/admin/mas") + `<main class="cuerpo sin-tabs" data-desliz="c" style="padding-top:8px">
    <p class="t2">Todo intento de marcaje, válido o no. Las señales son para revisar: nada se bloquea solo.</p>
    <div class="chips">${chip("todo", "Todo")}${chip("senales", "Señales")}${chip("fallidos", "Intentos fallidos")}</div>
    <div class="lista">${lista.map((x) => { const al = R.alumno(x.alumnoId), a = x.actividadId && R.actividad(x.actividadId); const ok = x.resultado === "ok"; return `<div class="tarjeta pila" style="gap:8px;${x.senal ? "box-shadow:inset 3px 0 0 var(--rojo),var(--sombra)" : ""}"><div class="fila"><div class="crece"><p class="t1 corta" style="font-size:14.5px">${esc(al?.nombre || al?.email)}</p><p class="t3">${R.fecha(x.cuando)}</p></div>${x.resultado ? `<span class="etq ${ok ? "verde" : "rojo"}">${R.etiqueta(x.resultado)}</span>` : `<span class="etq gris">${R.etiqueta(x.evento)}</span>`}</div>
      <p class="t2">${a ? esc(a.nombre) : esc(x.detalle || "")}${x.origen ? ` · ${x.origen === "manual" ? "Manual" : "QR"}` : ""}${a && x.detalle ? ` · ${esc(x.detalle)}` : ""}</p>
      ${x.senal ? `<p class="error fila" style="gap:6px">${ico("alerta")}${x.senal}</p>` : ""}<p class="t3" style="font-family:ui-monospace,monospace">${x.dispositivo} · ${x.ip}</p></div>`; }).join("")}</div></main>`;
}
function kiosco() {
  const a = R.actividad(E.kiosco);
  return `<div class="kiosco"><button class="btn sec chico cerrar" data-accion="kiosco">${ico("x")}Salir del kiosco</button>
    <div><img src="../escudo-umg.webp" alt="" style="height:7vh"><h1>${esc(a.nombre)}</h1><p class="t2" style="font-size:clamp(15px,2.2vh,24px)">${esc(a.lugar || "")}</p></div>
    <canvas data-qr="${a.id}" width="870" height="870"></canvas>
    <p style="font-size:clamp(17px,2.8vh,30px);font-weight:600">Escaneá con la cámara de tu teléfono</p>
    <div class="fila" style="align-items:baseline;gap:8px"><span class="cuenta" data-cuenta>60</span><span class="t2" style="font-size:3vh">s</span></div>
    <div class="riel"><div data-barra></div></div><p class="t3">QR de demostración · en la app real cambia cada ${a.ventanaSeg} segundos</p></div>`;
}

/* ---------- Enrutado ---------- */
R.pintar = function () {
  const r = R.ruta(), yo = R.yo();
  let v = "";
  if (!yo) v = r === "/registro" ? vRegistro() : r === "/recuperar" ? vRecuperar() : vIngreso();
  else if (!yo.perfil) v = vPerfil();
  else if (r.startsWith("/marcar/")) v = vMarcar(r.split("/")[2]);
  else if (yo.rol === "admin" && !E.vistaAlumno) {
    const p = r.split("/");
    v = r === "/admin/actividades" ? vAdminActividades() : p[2] === "vivo" ? vVivo(p[3]) : r === "/admin/alumnos" ? vAlumnos() : p[2] === "alumno" ? vAlumno(p[3])
      : r === "/admin/avisos" ? vAvisos() : r === "/admin/mas" ? vMas() : r === "/admin/catedraticos" ? vCatedraticos() : r === "/admin/clases" ? vClases() : r === "/admin/bitacora" ? vBitacora() : vTablero();
  } else {
    v = r === "/actividades" ? vActividades() : r === "/extra" ? vExtra() : r === "/cursos" ? vCursos() : r === "/yo" ? vYo() : vInicio();
    if (yo.rol === "admin") v = `<div class="cinta"><span>Te estás viendo como alumno</span><button class="enlace" style="color:inherit;text-decoration:underline" data-accion="vista-alumno" data-v="0">Volver al panel</button></div>` + v;
  }
  const h = E.hoja;
  const hojas = !h ? "" : h.tipo === "clase" ? hojaClase(h.id) : h.tipo === "como-marcar" ? hojaComoMarcar(h.id) : h.tipo === "ios" ? hojaIos() : h.tipo === "actividad" ? hojaActividad(h.id)
    : h.tipo === "manual" ? hojaManual(h.id) : h.tipo === "inscripciones" ? hojaInscripciones(h.id) : h.tipo === "docente" ? hojaDocente() : "";
  const toast = E.toast ? `<div class="toast">${ico("ok")}${esc(E.toast.texto)}</div>` : "";
  return `<div class="marco">${v}${hojas}${toast}</div>${E.kiosco ? kiosco() : ""}`;
};
R.arrancar();
</script>
</body>
</html>
