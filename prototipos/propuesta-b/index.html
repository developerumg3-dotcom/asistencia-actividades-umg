<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1622">
<title>Ronda — Propuesta B · Marcador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#0a1622;--sup:#11222f;--sup2:#19303f;--linea:rgba(255,255,255,.09);
  --texto:#eef4f9;--gris:#9db0c0;--tenue:#6f8496;
  --azul:#4aa8dc;--azul-f:#1c72a5;--azul-t:rgba(74,168,220,.16);
  --oro:#e6bd72;--oro-t:rgba(230,189,114,.15);
  --verde:#55d9a3;--verde-t:rgba(85,217,163,.15);--rojo:#ff8380;--rojo-t:rgba(255,131,128,.14);
  --r:20px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--texto);background:#03080d;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.ico{width:22px;height:22px;flex:none}
.sora{font-family:Sora,Inter,sans-serif}
#app{height:100dvh;display:flex;justify-content:center;align-items:center}
.marco{position:relative;width:100%;height:100dvh;background:radial-gradient(120% 60% at 50% -10%,#16405c 0%,var(--fondo) 60%);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:600px){.marco{width:402px;height:min(860px,calc(100dvh - 32px));border-radius:38px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 10px #1b2731}}
.cuerpo{flex:1;overflow-y:auto;padding:20px 16px 120px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none}
.cuerpo::-webkit-scrollbar{display:none}
.cuerpo.sin-nav{padding-bottom:28px}
/* Barra flotante */
.nav{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));height:66px;border-radius:33px;background:rgba(25,48,63,.86);backdrop-filter:blur(18px);border:1px solid var(--linea);display:flex;align-items:center;padding:0 6px;box-shadow:0 14px 34px rgba(0,0,0,.45);z-index:6}
.nav a,.nav button.lado{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--tenue);position:relative}
.nav a.activa{color:var(--texto)}
.nav a.activa::after{content:"";position:absolute;bottom:-8px;width:5px;height:5px;border-radius:50%;background:var(--oro)}
.nav .centro{width:60px;height:60px;border-radius:50%;margin:-26px 6px 0;background:linear-gradient(145deg,#5cb9ec,#1c72a5);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 8px 22px rgba(74,168,220,.5),0 0 0 6px var(--fondo)}
.nav .centro .ico{width:27px;height:27px}
.nav .centro.viva{animation:late 2s infinite}
@keyframes late{50%{box-shadow:0 8px 22px rgba(74,168,220,.5),0 0 0 6px var(--fondo),0 0 0 13px rgba(74,168,220,.22)}}
.nav .globo{position:absolute;top:-4px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--oro);color:#2b1f06;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
/* Tipografia */
.cab{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cab h1{font-family:Sora;font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.cab p{color:var(--gris);font-size:13.5px;margin-top:3px}
.sobre{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
.t1{font-weight:600;font-size:15px;line-height:1.3}
.t2{color:var(--gris);font-size:13px}
.t3{color:var(--tenue);font-size:12px}
.corta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila{display:flex;align-items:center;gap:12px}
.crece{flex:1;min-width:0}
.pila{display:flex;flex-direction:column;gap:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline}
.sec h2{font-family:Sora;font-size:17px;font-weight:700;letter-spacing:-.01em}
.sec a,.sec button{color:var(--azul);font-size:13px;font-weight:600}
.atras{display:flex;align-items:center;gap:8px;padding:14px 12px 0}
.atras a{width:40px;height:40px;border-radius:50%;background:var(--sup2);display:grid;place-items:center}
.atras h1{font-family:Sora;font-size:18px;font-weight:700;flex:1}
/* Superficies */
.sup{background:var(--sup);border:1px solid var(--linea);border-radius:var(--r);padding:16px}
.avatar{width:42px;height:42px;border-radius:14px;background:var(--azul-t);color:var(--azul);font-weight:700;font-size:14px;display:grid;place-items:center;flex:none}
.avatar.oro{background:var(--oro-t);color:var(--oro)}
.heroe{border-radius:26px;padding:20px;background:linear-gradient(150deg,#1f7fb8 0%,#14506f 55%,#0f3a52 100%);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.14)}
.heroe::after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(230,189,114,.35),transparent 65%)}
.heroe .gran{font-family:Sora;font-size:58px;font-weight:800;letter-spacing:-.05em;line-height:1}
.heroe .gran small{font-size:20px;font-weight:600;opacity:.7;letter-spacing:-.01em}
.tramos{display:flex;gap:5px;margin-top:14px}
.tramos i{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.2)}
.tramos i.si{background:#fff}.tramos i.viva{background:var(--oro);animation:parpadea 1.4s infinite}
@keyframes parpadea{50%{opacity:.45}}
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.loseta{background:var(--sup);border:1px solid var(--linea);border-radius:22px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:138px;position:relative}
.loseta:active{transform:scale(.97)}
.loseta .num{font-family:Sora;font-size:46px;font-weight:800;letter-spacing:-.05em;line-height:.95;color:var(--oro)}
.loseta .num small{font-family:Inter;font-size:12px;font-weight:600;letter-spacing:0;color:var(--tenue);margin-left:4px}
.loseta .nom{font-size:13.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:auto}
.loseta .mas-extra{position:absolute;top:12px;right:12px}
.etq{display:inline-flex;align-items:center;gap:4px;height:23px;padding:0 9px;border-radius:8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.etq .ico{width:13px;height:13px;stroke-width:2.6}
.etq.azul{background:var(--azul);color:#06202f}.etq.celeste{background:var(--azul-t);color:var(--azul)}
.etq.verde{background:var(--verde-t);color:var(--verde)}.etq.gris{background:rgba(255,255,255,.08);color:var(--gris)}
.etq.oro{background:var(--oro-t);color:var(--oro)}.etq.rojo{background:var(--rojo-t);color:var(--rojo)}
/* Linea de tiempo */
.tiempo{display:flex;flex-direction:column}
.hito{display:flex;gap:14px;position:relative;padding-bottom:18px}
.hito:last-child{padding-bottom:0}
.hito::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--linea)}
.hito:last-child::before{display:none}
.nodo{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--sup2);color:var(--tenue);border:1px solid var(--linea)}
.nodo .ico{width:17px;height:17px;stroke-width:2.6}
.nodo.si{background:var(--verde-t);color:var(--verde);border-color:transparent}
.nodo.viva{background:var(--azul);color:#06202f;border-color:transparent;box-shadow:0 0 0 5px var(--azul-t)}
.nodo.prox{background:var(--azul-t);color:var(--azul);border-color:transparent}
/* Filas densas */
.tabla{background:var(--sup);border:1px solid var(--linea);border-radius:var(--r);overflow:hidden}
.tabla>*{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;border-bottom:1px solid var(--linea)}
.tabla>*:last-child{border-bottom:0}
.tabla>.nuevo{animation:nuevo 1.8s}
@keyframes nuevo{from{background:var(--verde-t)}}
/* Botones y campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:25px;font-weight:700;font-size:15px;background:var(--azul);color:#06202f;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ancho{width:100%}
.btn.sec{background:var(--sup2);color:var(--texto);border:1px solid var(--linea)}
.btn.blanco{background:#fff;color:#0f3a52}
.btn.chico{height:36px;padding:0 14px;font-size:13px}
.btn.chico .ico{width:17px;height:17px}
.enlace{color:var(--azul);font-weight:600;font-size:14px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:13px;font-weight:600;color:var(--gris)}
.campo input,.campo select,.campo textarea{height:50px;border-radius:14px;border:1px solid var(--linea);background:var(--sup2);padding:0 14px;font-size:16px;outline:none;width:100%;color-scheme:dark}
.campo textarea{height:auto;padding:12px 14px;resize:none}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--azul);box-shadow:0 0 0 4px var(--azul-t)}
.campo input::placeholder,.campo textarea::placeholder,.busca input::placeholder{color:var(--tenue)}
.campo small{color:var(--tenue);font-size:12px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.busca{position:relative}
.busca .ico{position:absolute;left:16px;top:14px;color:var(--tenue)}
.busca input{height:50px;width:100%;border-radius:25px;border:1px solid var(--linea);background:var(--sup);padding:0 16px 0 46px;font-size:16px;outline:none}
.busca input:focus{border-color:var(--azul)}
.error{color:var(--rojo);font-size:13.5px;font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:18px;border:1px solid var(--linea);font-weight:600;font-size:13.5px;color:var(--gris)}
.chip.activo{background:var(--texto);color:var(--fondo);border-color:transparent}
.caja{width:24px;height:24px;border-radius:8px;border:2px solid var(--tenue);display:grid;place-items:center;flex:none;color:#06202f}
.caja .ico{width:15px;height:15px;stroke-width:3.2}
.caja.si{background:var(--azul);border-color:var(--azul)}
.interruptor{width:50px;height:30px;border-radius:15px;background:var(--sup2);border:1px solid var(--linea);position:relative;flex:none;transition:background .2s}
.interruptor::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--gris);transition:left .2s,background .2s}
.interruptor.si{background:var(--azul)}.interruptor.si::after{left:23px;background:#fff}
.mas1{height:38px;padding:0 14px;border-radius:19px;background:var(--oro);color:#2b1f06;font-weight:700;font-size:14px;flex:none}
.mas1:disabled{background:var(--sup2);color:var(--tenue);cursor:default}
.vacio{border:1.5px dashed var(--linea);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--gris);font-size:14px}
.nota{border-radius:18px;padding:13px 15px;display:flex;gap:12px;align-items:center;font-size:13.5px}
.nota.oro{background:var(--oro-t);color:var(--oro)}.nota.verde{background:var(--verde-t);color:var(--verde)}.nota.rojo{background:var(--rojo-t);color:var(--rojo)}
.nota b{color:var(--texto)}
/* Hojas */
.velo{position:absolute;inset:0;background:rgba(2,8,13,.66);display:flex;align-items:flex-end;z-index:20;animation:aparece .18s;backdrop-filter:blur(3px)}
.hoja{width:100%;max-height:88%;overflow-y:auto;background:var(--sup);border-radius:30px 30px 0 0;border-top:1px solid var(--linea);padding:10px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:sube .28s cubic-bezier(.2,.8,.2,1)}
.hoja::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--sup2);align-self:center;flex:none}
.hoja h3{font-family:Sora;font-size:20px;font-weight:700;letter-spacing:-.02em}
.hoja .sup{background:var(--sup2)}
.hoja .campo input,.hoja .campo select,.hoja .campo textarea{background:var(--fondo)}
@keyframes aparece{from{opacity:0}}@keyframes sube{from{transform:translateY(40px);opacity:.5}}
.toast{position:absolute;left:16px;right:16px;top:16px;background:#fff;color:#0a1622;border-radius:18px;padding:13px 16px;font-size:14px;font-weight:600;z-index:30;display:flex;gap:10px;align-items:center;animation:baja .28s;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.toast .ico{color:#0e8a5f}
@keyframes baja{from{transform:translateY(-30px);opacity:0}}
.rapidas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rapidas button,.rapidas a{background:var(--sup2);border:1px solid var(--linea);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;font-weight:600}
.rapidas .ico{width:26px;height:26px;color:var(--azul)}
.rapidas span{font-weight:400;font-size:12.5px;color:var(--gris)}
/* Entrada */
.auth{flex:1;overflow-y:auto;padding:40px 22px 28px;display:flex;flex-direction:column;gap:20px}
.auth>:first-child{margin-top:auto}.auth>:last-child{margin-bottom:auto}
.marca{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.marca .aro{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 8px rgba(255,255,255,.07),0 20px 40px rgba(0,0,0,.4)}
.marca img{width:78px;height:78px;object-fit:contain}
.marca h1{font-family:Sora;font-size:34px;font-weight:800;letter-spacing:-.04em;margin-top:12px}
.marca p{color:var(--gris);font-size:14px;max-width:280px}
.demo{border:1px dashed rgba(230,189,114,.45);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.demo>p{font-size:11px;font-weight:700;color:var(--oro);text-transform:uppercase;letter-spacing:.1em}
.demo button{display:flex;align-items:center;gap:10px;background:var(--sup);border:1px solid var(--linea);border-radius:16px;padding:10px 12px;text-align:left;font-size:13px}
.demo button b{display:block;font-size:14px}
.demo button span span{color:var(--gris)}
/* Marcaje */
.marcaje{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;padding:28px 24px;text-align:center}
.marcaje.bien{background:radial-gradient(90% 60% at 50% 30%,#1b8f68,#0a3d2e 75%)}
.marcaje.mal{background:radial-gradient(90% 60% at 50% 30%,#a53b39,#3d1312 75%)}
.boton-marcar{width:214px;height:214px;border-radius:50%;background:linear-gradient(145deg,#62bff0,#1c72a5);color:#fff;font-family:Sora;font-size:22px;font-weight:700;line-height:1.15;box-shadow:0 0 0 14px rgba(74,168,220,.16),0 0 0 30px rgba(74,168,220,.07),0 24px 50px rgba(28,114,165,.5);animation:respira 2.4s infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.boton-marcar .ico{width:44px;height:44px}
.boton-marcar:active{transform:scale(.95)}
@keyframes respira{50%{box-shadow:0 0 0 20px rgba(74,168,220,.14),0 0 0 42px rgba(74,168,220,.05),0 24px 50px rgba(28,114,165,.5)}}
.sello{width:128px;height:128px;border-radius:50%;background:#fff;display:grid;place-items:center;animation:sello .55s cubic-bezier(.2,1.5,.4,1)}
.sello .ico{width:66px;height:66px;stroke-width:2.8}
.bien .sello{color:#0e8a5f}.mal .sello{color:#b3302e}
@keyframes sello{from{transform:scale(.3) rotate(-20deg);opacity:0}}
.cinta{background:var(--oro-t);color:var(--oro);font-size:12.5px;font-weight:600;padding:9px 16px;display:flex;justify-content:space-between;gap:8px}
/* Kiosco */
.kiosco{position:fixed;inset:0;background:radial-gradient(100% 70% at 50% 0%,#16405c,#0a1622 70%);z-index:100;display:flex;align-items:center;justify-content:center;gap:6vw;padding:4vh 5vw;flex-wrap:wrap;text-align:center}
.kiosco .qr{background:#fff;padding:2.4vh;border-radius:3vh;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.kiosco canvas{display:block;width:min(64vh,80vw);height:min(64vh,80vw)}
.kiosco .lado{display:flex;flex-direction:column;align-items:center;gap:2.4vh;max-width:520px}
.kiosco h1{font-family:Sora;font-size:clamp(26px,4.6vh,56px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kiosco .aro{width:clamp(120px,22vh,230px);height:clamp(120px,22vh,230px);border-radius:50%;border:8px solid var(--azul-t);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.kiosco .aro b{font-family:Sora;font-size:clamp(44px,9vh,100px);font-weight:800;color:var(--oro);line-height:1}
.kiosco .riel{width:100%;height:10px;border-radius:5px;background:var(--azul-t);overflow:hidden}
.kiosco .riel div{height:100%;background:var(--azul);transition:width .5s linear}
.kiosco .cerrar{position:absolute;top:18px;right:18px}
@media(max-aspect-ratio:13/10){.kiosco{flex-direction:column;flex-wrap:nowrap;gap:2vh}.kiosco canvas{width:min(44vh,78vw);height:min(44vh,78vw)}.kiosco .lado{gap:1.4vh}.kiosco .lado img{display:none}.kiosco .aro{width:15vh;height:15vh;border-width:5px}.kiosco .aro b{font-size:6.5vh}}
.cuerpo>*,.hoja>*,.auth>*,.marcaje>*{flex-shrink:0}
.btn{white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>
<script src="../comun.js?v=3"></script>
<script>
const R = Ronda, E = R.E, ico = R.ico, esc = R.esc;
const campo = (id, etq, extra = "", ayuda = "") => `<div class="campo"><label for="${id}">${etq}</label><input id="${id}" ${extra}>${ayuda ? `<small>${ayuda}</small>` : ""}</div>`;
const corto = (n) => (n || "").split(" ")[0];
const MARCA = (titulo, texto) => `<div class="marca"><div class="aro"><img src="../escudo-umg.webp" alt=""></div><h1>${titulo}</h1><p>${texto}</p></div>`;

// En esta propuesta el punto extra se reparte de a uno, con un toque por clase.
R.on("sumar-extra", (d) => {
  const yo = R.yo(); if (R.puntos(yo).saldo < 1) return;
  yo.extra.push({ claseId: d.id, puntos: 1, cuando: new Date() });
  R.toast(`+1 para ${R.clase(d.id).nombre}`);
});

/* ---------- Piezas ---------- */
function nav(lados, centro) {
  const r = R.ruta();
  const lado = ([href, icono, texto, globo]) => { const activa = href === "/admin" ? r === "/admin" : r.startsWith(href); return `<a class="${activa ? "activa" : ""}" href="#${href}">${ico(icono)}${texto}${globo ? `<span class="globo">${globo}</span>` : ""}</a>`; };
  return `<nav class="nav">${lados.slice(0, 2).map(lado).join("")}${centro}${lados.slice(2).map(lado).join("")}</nav>`;
}
function navAlumno() {
  const yo = R.yo(), a = R.abierta(); const viva = a && !yo.asis[a.id];
  return nav([["/inicio", "puntos", "Puntos"], ["/agenda", "calendario", "Agenda"], ["/extra", "regalo", "Extra", R.puntos(yo).saldo || ""], ["/yo", "usuario", "Perfil"]],
    `<button class="centro ${viva ? "viva" : ""}" data-accion="hoja" data-hoja="marcar" aria-label="Marcar asistencia">${ico("qr")}</button>`);
}
const navAdmin = () => nav([["/admin", "tablero", "Hoy"], ["/admin/actividades", "calendario", "Actividades"], ["/admin/alumnos", "usuarios", "Alumnos"], ["/admin/mas", "mas", "Más"]],
  `<button class="centro" data-accion="hoja" data-hoja="rapidas" aria-label="Acciones rápidas">${ico("sumar")}</button>`);
const atras = (titulo, href, extra = "") => `<div class="atras"><a href="#${href}" aria-label="Volver">${ico("izq")}</a><h1>${esc(titulo)}</h1>${extra}</div>`;
const hoja = (html) => `<div class="velo" data-accion="cerrar-hoja" data-solo="1"><div class="hoja">${html}</div></div>`;
function etqAct(a, al) {
  const est = R.estadoAct(a);
  if (est === "borrador") return `<span class="etq gris">Borrador</span>`;
  if (al && al.asis[a.id]) return `<span class="etq verde">${ico("ok")}Asististe</span>`;
  if (est === "abierta") return `<span class="etq azul">Abierta ahora</span>`;

    <div class="chips">${chip("todas", "Todas")}${chip("sin", `Sin catedrático (${sin})`)}${[...new Set(E.clases.map((c) => c.ciclo))].map((c) => chip(c, "Ciclo " + c)).join("")}</div>
    ${lista.map((c) => `<div class="sup pila" style="gap:10px"><div class="fila"><div class="crece"><p class="t1">${esc(c.nombre)}</p><p class="t3">${c.codigo} · Ciclo ${c.ciclo} · Sección ${c.seccion} · ${c.jornada}</p></div>${c.docenteId ? "" : '<span class="etq oro">Sin catedrático</span>'}</div>
      <div class="campo"><select data-cambio="docente" data-id="${c.id}" aria-label="Catedrático"><option value="">Sin catedrático</option>${E.docentes.map((d) => `<option value="${d.id}" ${c.docenteId === d.id ? "selected" : ""}>${esc(d.nombre)}</option>`).join("")}</select></div></div>`).join("")}</main>`;
}
function vBitacora() {
  const f = E.ui.fBit || "todo";
  const lista = E.bitacora.filter((x) => f === "todo" || (f === "senales" ? x.senal : x.resultado && x.resultado !== "ok"));
  const chip = (v, t) => `<button class="chip ${f === v ? "activo" : ""}" data-accion="ui" data-k="fBit" data-v="${v}">${t}</button>`;
  return atras("Bitácora", "/admin/mas") + `<main class="cuerpo sin-nav" data-desliz="c" style="padding-top:12px"><p class="t2">Todo intento de marcaje, válido o no. Las señales son para revisar: nada se bloquea solo.</p>
    <div class="chips">${chip("todo", "Todo")}${chip("senales", "Señales")}${chip("fallidos", "Intentos fallidos")}</div>
    <div class="sup tiempo">${lista.map((x) => { const al = R.alumno(x.alumnoId), a = x.actividadId && R.actividad(x.actividadId); const ok = x.resultado === "ok";
      return `<div class="hito"><span class="nodo ${ok ? "si" : ""}" ${x.resultado && !ok ? 'style="background:var(--rojo-t);color:var(--rojo);border-color:transparent"' : ""}>${ico(ok ? "ok" : x.resultado ? "x" : "editar")}</span><div class="crece"><div class="fila" style="gap:8px"><p class="t1 corta crece" style="font-size:14.5px">${esc(al?.nombre || al?.email)}</p><span class="t3" style="white-space:nowrap">${R.hora(x.cuando)}</span></div>
        <p class="t3">${R.dia(x.cuando)} · ${a ? esc(a.nombre) : esc(x.detalle || "")}${x.origen ? ` · ${x.origen === "manual" ? "Manual" : "QR"}` : ""}</p>
        <div class="fila" style="gap:6px;margin-top:6px;flex-wrap:wrap"><span class="etq ${ok ? "verde" : x.resultado ? "rojo" : "gris"}">${R.etiqueta(x.resultado || x.evento)}</span>${x.senal ? `<span class="etq rojo">${ico("alerta")}${x.senal}</span>` : ""}</div></div></div>`; }).join("")}</div></main>`;
}
function kiosco() {
  const a = R.actividad(E.kiosco);
  return `<div class="kiosco"><button class="btn sec chico cerrar" data-accion="kiosco">${ico("x")}Salir</button>
    <div class="qr"><canvas data-qr="${a.id}" width="870" height="870"></canvas></div>
    <div class="lado"><img src="../escudo-umg.webp" alt="" style="height:9vh;background:#fff;border-radius:50%;padding:4px"><h1>${esc(a.nombre)}</h1><p class="t2" style="font-size:clamp(15px,2.4vh,24px)">${esc(a.lugar || "")}</p>
      <div class="aro"><b data-cuenta>60</b><span class="sobre">segundos</span></div><div class="riel"><div data-barra></div></div>
      <p style="font-size:clamp(17px,2.8vh,28px);font-weight:600">Escaneá con la cámara de tu teléfono</p><p class="t3">QR de demostración · en la app real cambia cada ${a.ventanaSeg} s</p></div></div>`;
}

/* ---------- Enrutado ---------- */
R.pintar = function () {
  const r = R.ruta(), yo = R.yo();
  let v = "";
  if (!yo) v = r === "/registro" ? vRegistro() : r === "/recuperar" ? vRecuperar() : vIngreso();
  else if (!yo.perfil) v = vPerfil();
  else if (r.startsWith("/marcar/")) v = vMarcar(r.split("/")[2]);
  else if (yo.rol === "admin" && !E.vistaAlumno) {
    const p = r.split("/");
    v = r === "/admin/actividades" ? vAdminActividades() : p[2] === "vivo" ? vVivo(p[3]) : r === "/admin/alumnos" ? vAlumnos() : p[2] === "alumno" ? vAlumno(p[3])
      : r === "/admin/avisos" ? vAvisos() : r === "/admin/mas" ? vMas() : r === "/admin/catedraticos" ? vCatedraticos() : r === "/admin/clases" ? vClases() : r === "/admin/bitacora" ? vBitacora() : vHoy();
  } else {
    v = r === "/agenda" ? vAgenda() : r === "/extra" ? vExtra() : r === "/cursos" ? vCursos() : r === "/yo" ? vYo() : vInicio();
    if (yo.rol === "admin") v = `<div class="cinta"><span>Te estás viendo como alumno</span><button style="text-decoration:underline;font-weight:600" data-accion="vista-alumno" data-v="0">Volver al panel</button></div>` + v;
  }
  const h = E.hoja;
  const hojas = !h ? "" : h.tipo === "clase" ? hojaClase(h.id) : h.tipo === "marcar" ? hojaMarcar() : h.tipo === "ios" ? hojaIos() : h.tipo === "rapidas" ? hojaRapidas() : h.tipo === "actividad" ? hojaActividad(h.id)
    : h.tipo === "manual" ? hojaManual(h.id) : h.tipo === "inscripciones" ? hojaInscripciones(h.id) : h.tipo === "docente" ? hojaDocente() : "";
  const toast = E.toast ? `<div class="toast">${ico("ok")}${esc(E.toast.texto)}</div>` : "";
  return `<div class="marco">${v}${hojas}${toast}</div>${E.kiosco ? kiosco() : ""}`;
};
R.arrancar();
</script>
</body>
</html>
